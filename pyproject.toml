[project]
name = "gitingest"
version = "0.3.1"
description = "CLI tool to analyze and create text dumps of codebases for LLMs (YOLO Fleet Edition)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "gitpython>=3.1.0",
    "httpx",
    "loguru>=0.7.0",
    "pathspec>=0.12.1",
    "pydantic",
    "python-dotenv",
    "starlette>=0.40.0",
    "tiktoken>=0.7.0",
]

license = { file = "LICENSE" }
authors = [
    { name = "Romain Courtois", email = "romain@coderamp.io" },
    { name = "Filip Christiansen" },
    { name = "yolo-rs", email = "contact@aphrody.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "eval-type-backport",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff>=0.8.0",
]

server = [
    "boto3>=1.28.0",
    "fastapi[standard]>=0.109.1",
    "prometheus-client",
    "sentry-sdk[fastapi]",
    "slowapi",
    "uvicorn>=0.11.7",
]

[dependency-groups]
dev = [
    "boto3>=1.28.0",
    "fastapi[standard]>=0.109.1",
    "prometheus-client",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "sentry-sdk[fastapi]",
    "slowapi",
    "uvicorn>=0.11.7",
]

[project.scripts]
gitingest = "gitingest.__main__:main"

[project.urls]
homepage = "https://gitingest.com"
github = "https://github.com/yolo-rs/gitingest"
upstream = "https://github.com/coderamp-labs/gitingest"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true

[tool.uv]
required-version = ">=0.13.7"

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "D107", # undocumented-public-init
]
per-file-ignores = { "tests/**/*.py" = ["D", "E501", "S101"], "src/gitingest/{__main__,clone,entrypoint,ingestion,output_formatter,query_parser}.py" = ["E501"], "src/gitingest/schemas/*.py" = ["E501"], "src/gitingest/utils/*.py" = ["E501"], "src/server/**/*.py" = ["E501"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
order-by-type = true
case-sensitive = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_classes = "Test*"
python_functions = "test_*"
